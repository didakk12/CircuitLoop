[project]
name = "circuitloop-ml-service"
version = "0.1.0"
description = "CircuitLoop internal ML service: Gemini-based component detection and Neo4j-backed RAG retrieval. Called only by the TypeScript backend — never exposed to the browser. See ML_SERVICE_INTEGRATION_PLAN.md."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "opencv-python>=4.10",
    "sentence-transformers>=5.0",
    "neo4j>=6.0",
    "numpy>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
