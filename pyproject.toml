[project]
name = "circuitloop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "faiss-cpu",
    "httpx2>=0.1.0",
    "numpy",
    "opencv-python",
    "pdfplumber",
    "Pillow",
    "pytest>=8.0.0",
    "pytesseract",
    "sqlalchemy>=2.0.52",
    "sentence-transformers",
    "ultralytics",
    "uvicorn>=0.52.3",
]

[project.scripts]
circuitloop = "main:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
